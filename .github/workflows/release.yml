name: Release

# Pushing a tag like v0.1.0 builds a signed APK and attaches it to a GitHub
# Release named after the tag.
#
# Do not rename this file: versionCode is this workflow's run number, and a
# renamed workflow starts counting from 1 again, which Android would refuse to
# install over an existing copy.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change
      # what runs with access to the signing key.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not of the form v1.2.3" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          # The runner image ships the Android SDK. With the licenses accepted,
          # the Android Gradle plugin downloads any platform or build tools it
          # is missing.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) > /dev/null

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/term.keystore")

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "The $name secret is not set" >&2
              exit 1
            fi
          done
          export KEYSTORE_FILE="$RUNNER_TEMP/term.keystore"
          ./gradlew --no-daemon assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="$VERSION_CODE"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/term.keystore"

      - name: Verify and name the APK
        run: |
          set -euo pipefail
          # An unsigned build is named app-release-unsigned.apk, so this fails
          # if signing was skipped.
          cp app/build/outputs/apk/release/app-release.apk "term-$VERSION.apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "term-$VERSION.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "term-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "term-$VERSION.apk" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
